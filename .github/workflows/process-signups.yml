name: Behandle nye påmeldinger (helautomatisk onboarding)

# Plukker opp ÉN ventende rad fra Supabase `pending_signups` (skrevet dit av
# Google Apps Script når noen sender inn påmeldingsskjemaet, se
# WEBHOOK_ONBOARDING.md), logger inn på Garmin, oppretter brukeren, og
# sletter klartekst-passordene fra pending_signups. Se MULTIUSER_PLAN.md
# steg 6 («alternativ B») og process_pending_signups.py for detaljer.
#
# Kjører sjeldnere enn de andre skyjobbene med vilje (Garmin-innlogging ved
# onboarding er mer rate-limit-følsomt enn vanlig runde-synk, se advarselen
# i MULTIUSER_PLAN.md – behandler uansett kun ÉN påmelding per kjøring).
on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 6-21 * * *"   # UTC (= ca. 08–23 norsk sommertid), hvert 15. min

concurrency:
  group: process-signups      # aldri to kjøringer samtidig
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}     # EIERENS e-post – varsel om nye brukere
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}         # EIERENS push-emne – samme grunn
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer avhengigheter
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Behandle ventende påmeldinger
        run: python process_pending_signups.py
